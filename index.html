<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D 像素西安城墙夜游世界</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
</head>
<body data-skin="classic" data-mode="cloud" data-view="third">
<div class="app">
  <header class="topbar">
    <div class="top-title">
      <span class="top-emoji">🏯</span>
      <div>
        <h1>3D 像素西安城墙夜游世界</h1>
        <p class="top-sub">XI'AN WALL 3D VOXEL WORLD · 36 件风物</p>
      </div>
    </div>
    <div class="top-controls">
      <div class="mode-row" id="modeRow">
        <button class="mode-btn active" data-mode="cloud">☁️ 云逛</button>
        <button class="mode-btn" data-mode="real">📍 实景</button>
      </div>
      <div class="skin-row" id="skinRow">
        <button class="skin-btn active" data-skin="classic">🏯 古风夜游</button>
        <button class="skin-btn" data-skin="night">🌃 现代夜色</button>
        <button class="skin-btn" data-skin="cyber">🌆 赛博霓虹</button>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <span class="progress-text" id="progressText">风物 0 / 36</span>
    </div>
  </header>

  <main class="map-wrap" id="mapWrap">
    <div id="sceneBox"></div>
    <div class="map-hint" id="mapHint">左摇杆走路 · 右半屏滑动转镜头</div>
    <button class="view-btn" id="viewBtn">🎥 第三人称</button>
    <button class="debug-btn" id="debugBtn" hidden>🛠️ 室内测试：模拟瞬移到朝阳门</button>
    <div class="gps-line" id="gpsLine" hidden>定位中…</div>

    <div class="joystick" id="joystick">
      <div class="joy-knob" id="joyKnob"></div>
    </div>

    <button class="explore-btn" id="exploreBtn" hidden>🔍 探索：永宁门</button>
  </main>

  <footer class="bottombar">
    <button class="dex-open-btn" id="dexOpenBtn">📖 图鉴抽屉 <span id="dexCount">0/36</span></button>
    <span class="loc-text" id="locText">云逛模式 · 走到地标旁点亮高光</span>
  </footer>
</div>

<!-- 放射状开箱 -->
<div class="burst-mask" id="burstMask" hidden>
  <div class="burst-rays" id="burstRays"></div>
  <button class="burst-core" id="burstCore">✦</button>
  <p class="burst-tip" id="burstTip">点一下光芒中心，揭晓风物</p>
</div>

<!-- 风物卡片 -->
<div class="modal-mask" id="cardMask" hidden>
  <div class="modal pixel-box">
    <button class="modal-close" id="cardClose">✕</button>
    <div class="card-tier" id="cardTier">第 3 档 · 常见</div>
    <div class="card-emoji" id="cardEmoji">🏯</div>
    <div class="card-name" id="cardName">城门洞回声</div>
    <div class="card-meta" id="cardMeta">朝阳门 · 2026-11-22</div>
    <p class="card-story" id="cardStory"></p>
    <p class="card-note-line" id="cardNoteLine"></p>
    <button class="pixel-btn big" id="cardPostcardBtn">✎ 写进记忆明信片</button>
  </div>
</div>

<!-- 记忆明信片 -->
<div class="modal-mask" id="postcardMask" hidden>
  <div class="modal pixel-box">
    <button class="modal-close" id="postcardClose">✕</button>
    <div class="card-emoji" id="pcEmoji">🐱</div>
    <div class="card-name" id="pcName">霸道橘猫</div>
    <div class="card-rarity" id="pcRarity">★ 常见</div>
    <div class="card-meta" id="pcMeta">永宁门 · 2026-11-22</div>
    <p class="card-story" id="pcStory"></p>
    <label class="note-label" for="pcNote">今晚心情 / 偶遇笔记</label>
    <textarea id="pcNote" rows="2" maxlength="80" placeholder="写一句今晚的心情…（最多 80 字）"></textarea>
    <button class="pixel-btn big" id="pcSaveBtn">💾 保存笔记</button>
    <p class="card-tip">📸 直接截屏，就是一张像素记忆明信片</p>
  </div>
</div>

<!-- 图鉴抽屉 -->
<div class="drawer-mask" id="drawerMask" hidden>
  <div class="drawer">
    <div class="drawer-head">
      <span>📖 图鉴抽屉 · 36 件风物</span>
      <button class="modal-close" id="drawerClose">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
